apiVersion: v1
kind: Namespace
metadata:
  name: pricetruth
  labels:
    app.kubernetes.io/name: pricetruth
    app.kubernetes.io/part-of: pricetruth-ai
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pricetruth-app
  namespace: pricetruth
  labels:
    app.kubernetes.io/name: pricetruth-app
    app.kubernetes.io/part-of: pricetruth-ai
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-data-stores
  namespace: pricetruth
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [postgres, redis]}
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
